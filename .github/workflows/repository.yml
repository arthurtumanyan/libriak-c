name: Package repository

# Publishes the signed apt and dnf repositories on GitHub Pages from the
# packages of all GitHub releases. Called by the release workflow after a
# release is published; can also be started by hand.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c gnupg
      - name: Import signing key
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          test -n "$RELEASE_GPG_KEY" || { echo "secret RELEASE_GPG_KEY is not set"; exit 1; }
          printf '%s\n' "$RELEASE_GPG_KEY" | gpg --batch --import
          if [ -n "$RELEASE_GPG_PASSPHRASE" ]; then
            printf '%s' "$RELEASE_GPG_PASSPHRASE" > "$RUNNER_TEMP/passphrase"
            printf 'pinentry-mode loopback\npassphrase-file %s\n' "$RUNNER_TEMP/passphrase" >> ~/.gnupg/gpg.conf
          fi
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          echo "KEY=$key" >> "$GITHUB_ENV"
      - name: Download release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p '*.deb' -p '*.rpm' -D assets
          done
          ls assets
      - name: Build repositories
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          packaging/repo-site.sh assets site "$KEY" "https://$owner.github.io/${GITHUB_REPOSITORY#*/}"
      - name: Remove signing key
        if: always()
        run: rm -rf ~/.gnupg "$RUNNER_TEMP/passphrase"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
