name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.cc }} / ${{ matrix.config.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        config:
          - { name: asan, type: Debug, sanitize: "ON" }
          - { name: release, type: Release, sanitize: "OFF" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libjson-c-dev libprotobuf-c-dev protobuf-c-compiler libssl-dev zlib1g-dev valgrind
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.config.type }}
          -DRIAK_SANITIZE=${{ matrix.config.sanitize }}
          -DRIAK_WERROR=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Valgrind
        if: matrix.config.sanitize == 'OFF'
        run: |
          vg() { valgrind -q --leak-check=full --error-exitcode=1 "$@"; }
          for t in util parse multipart datatype api; do
            vg "build/tests/test_$t"
          done
          for t in client async; do
            python3 tests/stub_riak.py valgrind -q --leak-check=full --error-exitcode=1 \
              "build/tests/test_$t"
          done
          RIAK_TEST_CERTS=build/tests/certs python3 tests/stub_riak.py --tls build/tests/certs \
            valgrind -q --leak-check=full --error-exitcode=1 build/tests/test_tls
          # the stub's detached server threads leave reachable memory behind
          RIAK_TEST_CERTS=build/tests/certs valgrind -q --leak-check=full \
            --errors-for-leak-kinds=definite --error-exitcode=1 build/tests/test_pb
          python3 tests/stub_riak.py valgrind -q --leak-check=full --errors-for-leak-kinds=definite \
            --error-exitcode=1 build/tests/test_threads

  tsan:
    name: clang / thread sanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libjson-c-dev libprotobuf-c-dev protobuf-c-compiler libssl-dev zlib1g-dev
      - name: Build
        env:
          CC: clang
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DRIAK_SANITIZE=thread -DRIAK_WERROR=ON
          && cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  oldest:
    name: oldest supported (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libjson-c-dev libprotobuf-c-dev protobuf-c-compiler libssl-dev zlib1g-dev
      - run: cmake -S . -B build -DRIAK_WERROR=ON && cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  live:
    name: live Riak ${{ matrix.riak }} (${{ matrix.security }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        riak: ["2.2.3", "3.2.6", "3.4.1"]
        security: [plain, tls]
        include:
          # Riak 2.2.3 is the basho package image; 3.x is built from the
          # OpenRiak sources, layers cached between runs
          - { riak: "2.2.3", features: "2i,search,dt,counters,fold,linkwalk" }
          - riak: "3.2.6"
            otp: "24"
            features: "2i,dt,gset,counters,fold,linkwalk,aae,nextgenrepl,repl,nohttppreflist"
          - riak: "3.4.1"
            otp: "26"
            features: "2i,dt,gset,counters,fold,linkwalk,aae,nextgenrepl,repl,nohttppreflist,query"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Riak 2.2.3 image
        if: matrix.riak == '2.2.3'
        run: docker build -t "libriak-riak:${{ matrix.riak }}" tests/docker
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: matrix.riak != '2.2.3'
      - name: Build Riak ${{ matrix.riak }} image
        if: matrix.riak != '2.2.3'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tests/docker/openriak
          build-args: |
            OTP=${{ matrix.otp }}
            RIAK_TAG=riak-${{ matrix.riak }}
          tags: libriak-riak:${{ matrix.riak }}
          load: true
          cache-from: type=gha,scope=riak-${{ matrix.riak }}
          cache-to: type=gha,mode=max,scope=riak-${{ matrix.riak }}
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libjson-c-dev libprotobuf-c-dev protobuf-c-compiler libssl-dev zlib1g-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DRIAK_SANITIZE=ON && cmake --build build -j
      - name: Start Riak, create bucket types
        env:
          RIAK: ${{ matrix.riak }}
          SECURITY: ${{ matrix.security }}
        run: |
          docker run -d --name riak --ulimit nofile=65536:65536 \
            -p 8098:8098 -p 8087:8087 -p 8443:8443 "libriak-riak:$RIAK"
          if [ "$SECURITY" = tls ]; then
            sh tests/gen_certs.sh "$PWD/certs"
            sh tests/docker/setup-node.sh riak --security "$PWD/certs"
          else
            sh tests/docker/setup-node.sh riak
          fi
      - name: Live tests (HTTP)
        if: matrix.security == 'plain'
        env:
          RIAK_TEST_URL: http://127.0.0.1:8098
          RIAK_TEST_TYPE: libriak_multi
          RIAK_TEST_FEATURES: ${{ matrix.features }}
        run: ctest --test-dir build --output-on-failure -R live
      - name: Live tests (Protocol Buffers)
        if: matrix.security == 'plain'
        env:
          RIAK_TEST_URL: pb://127.0.0.1:8087
          RIAK_TEST_HTTP_PORT: "8098"
          RIAK_TEST_TYPE: libriak_multi
          RIAK_TEST_FEATURES: ${{ matrix.features }}
        run: ctest --test-dir build --output-on-failure -R live
      # Riak 2.2.3 runs on an Erlang/OTP that only completes a handshake with
      # tls_legacy; Riak 3.x needs no such option
      - name: Live tests (HTTPS, authenticated)
        if: matrix.security == 'tls'
        env:
          RIAK_TEST_URL: https://127.0.0.1:8443
          RIAK_TEST_USER: alice
          RIAK_TEST_PASSWORD: secret
          RIAK_TEST_CA: ${{ github.workspace }}/certs/ca.pem
          RIAK_TEST_TLS_LEGACY: ${{ matrix.riak == '2.2.3' && '1' || '0' }}
          RIAK_TEST_TYPE: libriak_multi
          RIAK_TEST_FEATURES: ${{ matrix.features }}
        run: ctest --test-dir build --output-on-failure -R live
      - name: Live tests (Protocol Buffers with STARTTLS, authenticated)
        if: matrix.security == 'tls'
        env:
          RIAK_TEST_URL: pbs://127.0.0.1:8087
          RIAK_TEST_HTTP_PORT: "8443"
          RIAK_TEST_USER: alice
          RIAK_TEST_PASSWORD: secret
          RIAK_TEST_CA: ${{ github.workspace }}/certs/ca.pem
          RIAK_TEST_TLS_LEGACY: ${{ matrix.riak == '2.2.3' && '1' || '0' }}
          RIAK_TEST_TYPE: libriak_multi
          RIAK_TEST_FEATURES: ${{ matrix.features }}
        run: ctest --test-dir build --output-on-failure -R live
      - name: Riak logs
        if: failure()
        run: docker logs riak 2>&1 | tail -100

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libjson-c-dev libprotobuf-c-dev protobuf-c-compiler libssl-dev zlib1g-dev && pipx install gcovr==8.7
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DRIAK_COVERAGE=ON && cmake --build build -j
      - run: ctest --test-dir build --output-on-failure
      - name: Coverage report (fails under 85% lines)
        run: |
          gcovr --root . --filter src/ --object-directory build --print-summary \
            --markdown-summary "$GITHUB_STEP_SUMMARY" --fail-under-line 85 build

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libjson-c-dev libprotobuf-c-dev protobuf-c-compiler libssl-dev zlib1g-dev
      - name: Build fuzzer
        env:
          CC: clang
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DRIAK_FUZZ=ON -DRIAK_SANITIZE=ON
          && cmake --build build -j --target fuzz_parse fuzz_pb
      - name: Fuzz for 60 seconds each
        run: |
          build/tests/fuzz_parse -max_total_time=60 -max_len=4096
          build/tests/fuzz_pb -max_total_time=60 -max_len=4096

  package:
    name: package dry run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libjson-c-dev libprotobuf-c-dev protobuf-c-compiler libssl-dev zlib1g-dev dpkg-dev file
      - run: packaging/build-packages.sh DEB
      - run: sudo apt-get install -y ./dist/*.deb && packaging/smoke-test.sh

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libjson-c-dev libprotobuf-c-dev protobuf-c-compiler libssl-dev zlib1g-dev cppcheck doxygen
          pipx install clang-format==23.1.3
          pipx install clang-tidy==23.1.4
      - name: clang-format
        run: clang-format --dry-run --Werror include/riak/*.h src/*.[ch] tests/*.[ch] examples/*.c
      - name: cppcheck
        run: cppcheck --error-exitcode=1 -q --enable=warning,portability,performance --std=c11 -I include -I src src
      - name: clang-tidy
        run: |
          cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build --target riak_pbgen
          clang-tidy -p build --warnings-as-errors='*' src/*.c
      - name: API reference (fails on undocumented symbols)
        run: mkdir -p out && RIAK_DOCS_OUT=out doxygen docs/Doxyfile
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color=false
