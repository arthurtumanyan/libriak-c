name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected behaviour, actual behaviour, and the riak_status / riak_client_errmsg() you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Minimal code or steps.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: libriak-c, Riak, libcurl, json-c, OS and compiler.
    validations:
      required: true
